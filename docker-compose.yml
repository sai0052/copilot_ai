services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - ./sample_projects:/workspace/sample_projects
      - backend_data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  backend_data:
